{{/*
Generated once on first install, then preserved on every subsequent
upgrade by reading it back via lookup - Helm re-renders every template on
every upgrade, so without this a plain `helm upgrade` would mint a new
random password and lock worker/webui out of the redis they were already
talking to.
*/}}
{{- $secretName := "k8coins-redis-auth" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := randAlphaNum 24 }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "k8coins.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc }}
