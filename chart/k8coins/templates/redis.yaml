{{- $ctx := dict "name" "redis" "root" $ }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "k8coins.labels" . | nindent 4 }}
    {{- include "k8coins.selectorLabels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "k8coins.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8coins.selectorLabels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # Vanilla redis (unlike bitnami's image) has no REDIS_PASSWORD
          # convention of its own, so the password is read from the env var
          # this Secret provides and passed to redis-server as --requirepass
          # via an explicit shell, rather than baked into the image or a
          # mounted config file.
          command:
            - sh
            - -c
            - exec redis-server --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8coins-redis-auth
                  key: password
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "k8coins.labels" . | nindent 4 }}
    {{- include "k8coins.selectorLabels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "k8coins.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
