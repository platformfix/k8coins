name: commit-lint

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-lint:
    name: commit-lint
    runs-on: ubuntu-latest
    # Dependabot's own commit messages don't pass commitlint's stricter
    # subject-case/body-line-length rules (its PR titles do - pr-lint still
    # runs for these). A job skipped by its own "if" reports as passing for
    # required-status-check purposes, so this exempts Dependabot without
    # weakening the check for anyone else.
    if: github.actor != 'dependabot[bot]'
    steps:
      # Plain pull_request already checks out the PR's own commits (unlike
      # pull_request_target, which defaults to the base branch), and gets a
      # read-only token for forked PRs instead of one scoped to this repo -
      # this job never needs write access, so there's no reason to run it
      # with pull_request_target's broader trust model.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
