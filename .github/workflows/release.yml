name: Release

on:
  push:
    branches: [main]

# Multiple pushes to main in quick succession (e.g. merging several PRs back
# to back) each trigger their own run of this workflow. Without this,
# concurrent runs' "version" jobs all read the same last tag before any of
# them has pushed a new one, compute the same next version, and race to
# create the same git tag - only the first to push wins, the rest fail with
# "tag already exists" (seen live on 2026-08-24 merging 5 PRs ~15s apart:
# all 5 computed v0.3.4, only one succeeded). cancel-in-progress: false
# queues runs instead of cancelling them, so each one starts only after the
# previous has fully finished (including its own tag push) and sees the
# correct, up-to-date last tag.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      should_release: ${{ steps.bump.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version bump from commit messages since last tag
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            echo "No prior tag found, considering the full commit history"
            LAST_TAG="v0.0.0"
            COMMITS=$(git log --pretty=format:"%s")
          else
            echo "Last tag: $LAST_TAG"
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s")
          fi
          if [ -z "$COMMITS" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUMP="patch"
          if echo "$COMMITS" | grep -qE "^[a-z]+(\(.+\))?!:|BREAKING CHANGE"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
          fi
          VERSION="${LAST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        service: [rng, hasher, worker, webui]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/platformfix/k8coins-${{ matrix.service }}:${{ needs.version.outputs.version }}
            ghcr.io/platformfix/k8coins-${{ matrix.service }}:latest

      # Signed SLSA build provenance, verifiable with "gh attestation verify".
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/platformfix/k8coins-${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # SPDX SBOM for the exact image just pushed (pinned to its digest, not
      # a floating tag), attested and attached alongside the provenance.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ghcr.io/platformfix/k8coins-${{ matrix.service }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/platformfix/k8coins-${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  # Publishes the chart two ways, both from the same resolved version, so
  # attendees can use whichever install path fits their environment:
  # OCI (helm install oci://...) and a traditional Helm repo hosted on
  # GitHub Pages (helm repo add + helm install), matching podium's own
  # chart-release.yml pattern for the latter.
  chart:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Chart.yaml's version must be strict semver with no "v" prefix (a
      # Helm requirement); appVersion keeps the "v" prefix so it matches
      # the actual image tags pushed above - the chart's default
      # image.tag (see values.yaml) falls back to appVersion, so an
      # install with no explicit tag override pulls the image built by
      # this exact same release. Modified only in the runner's local
      # checkout, not committed back to main - both publish paths below
      # read this same locally-modified file.
      - name: Set chart version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sed -i "s/^version: .*/version: ${VERSION#v}/" chart/k8coins/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" chart/k8coins/Chart.yaml

      - name: Package and push chart to OCI
        run: |
          helm package chart/k8coins --destination /tmp/chart-out
          helm push /tmp/chart-out/k8coins-*.tgz oci://ghcr.io/platformfix

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # Packages the same locally-modified chart, publishes the .tgz as a
      # GitHub Release asset (tagged k8coins-<version>, distinct from this
      # workflow's own v<version> app release tags below), and maintains
      # index.yaml on the gh-pages branch for "helm repo add".
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: chart
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # Signed provenance for the packaged chart .tgz, same as podium's
      # chart-release.yml. Guarded because skip_existing means a run with
      # nothing new to release leaves this directory empty.
      - name: Check for a new chart package
        id: check-package
        run: |
          if compgen -G ".cr-release-packages/*.tgz" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest chart provenance
        if: steps.check-package.outputs.found == 'true'
        uses: actions/attest@v4
        with:
          subject-path: '.cr-release-packages/*.tgz'
          push-to-registry: false

  tag-and-release:
    needs: [version, release, chart]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --generate-notes --title "$VERSION"
